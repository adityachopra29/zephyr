description: |
  TI Enhanced Quadrature Encoder Pulse based counter

  On SoCs where the EQEP inputs are reachable only through a crossbar
  (e.g. AM13E), reference the Input X-BAR via "mux-states" instead of
  adding SoC-specific pinmux logic to this driver. Each EQEP input is
  hard-wired to a fixed Input X-BAR channel (EQEP0A = INPUT17 / channel
  16, and so on); the board or overlay routes a GPIO into that channel
  and names the entry:

    &eqep0 {
            pinctrl-0 = <&gpio_pb11>;
            pinctrl-names = "default";

            /* PB11 (GPIO43) -> INPUTXBAR17 (ch 16) -> EQEP0A */
            mux-states = <&xbar1 16 AM13E230_XBAR_IN_STATE(43, 1)>;
            mux-state-names = "qepa";
    };

  Presence of "mux-states" also selects the Input X-BAR as the EQEP
  source in QEPSRCSEL (AM13E-only), since that mux is internal to the
  EQEP and separate from the crossbar itself.

include: [base.yaml, pinctrl-device.yaml, mux-consumer.yaml]

compatible: "ti,am3352-eqep"

properties:
  reg:
    required: true

  interrupts:
    required: true
