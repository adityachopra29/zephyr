description: |
  TI Enhanced Quadrature Encoder Pulse based counter

  On SoCs where the EQEP inputs are reachable only through a crossbar
  (e.g. AM13E), the routing travels with the pin choice: each pinctrl-0
  entry carrying "ti,xbar-in-gpio" metadata is routed through the
  "ti,input-xbar" device to the Input X-BAR channel at the same index of
  "ti,inputxbar-channels" (QEPA, QEPB, QEPI, QEPS order). The SoC
  devicetree sets both properties, so a board only selects the pins:

    &eqep0 {
            pinctrl-0 = <&inputxbar_pb11>;
            pinctrl-names = "default";
    };

include: [base.yaml, pinctrl-device.yaml]

compatible: "ti,am3352-eqep"

properties:
  reg:
    required: true

  interrupts:
    required: true

  ti,input-xbar:
    type: phandle
    description: |
      Input X-BAR device routing pins to this EQEP's QEPA/QEPB/QEPI/QEPS
      inputs (crossbar-routed SoCs only, e.g. AM13E). The routed GPIOs are
      taken from the "ti,xbar-in-gpio" metadata on the pinctrl-0 entries.

  ti,inputxbar-channels:
    type: array
    description: |
      Input X-BAR channels feeding this EQEP's QEPA, QEPB, QEPI and QEPS
      inputs, in that order. These are hard-wired per EQEP instance, so the
      SoC devicetree sets them; pinctrl-0 entry N is routed to entry N.
