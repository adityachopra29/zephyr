description: |
  TI SOC ECAP based PWM controller

  On SoCs where the eCAP's pins are reachable only through a crossbar
  (e.g. AM13E), reference the crossbar via "mux-states" instead of adding
  SoC-specific pinmux logic to this driver:

    &ecap0 {
            pinctrl-0 = <&my_apwm_pin>;
            pinctrl-names = "default";

            mux-states = <&xbar_out AM13E230_XBAR_OUT_CTRL(idx, group, bit) 1>;
            mux-state-names = "output";
    };

    &ecap1 {
            pinctrl-0 = <&my_capture_pin>;
            pinctrl-names = "default";

            mux-states = <&xbar_in CHANNEL AM13E230_XBAR_IN_STATE(GPIO_NUMBER, 1)>;
            mux-state-names = "input";
    };

  A "mux-states" entry named "input" additionally feeds this eCAP's own
  ECCTL0.INPUTSEL field (AM13E-only) with that entry's crossbar channel,
  since ECCTL0 is a mux internal to the eCAP, separate from the crossbar
  itself.

include: [pwm-controller.yaml, base.yaml, pinctrl-device.yaml, mux-consumer.yaml]

compatible: "ti,am3352-ecap"

properties:
  reg:
    required: true

  interrupts:
    required: true

  clock-frequency:
    type: int
    description: Optional peripheral frequency to use if the clock is absent

  ti,output-xbar:
    type: phandle
    description: |
      Output X-BAR device routing this eCAP's APWM output to a pin
      (crossbar-routed SoCs only, e.g. AM13E). The route itself is taken
      from the "ti,xbar-out" metadata on the first entry of pinctrl-0.

  ti,input-xbar:
    type: phandle
    description: |
      Input X-BAR device routing a pin to this eCAP's capture input
      (crossbar-routed SoCs only, e.g. AM13E). The routed GPIO is taken
      from the "ti,xbar-in-gpio" metadata on the first entry of pinctrl-0.

  ti,inputxbar-channel:
    type: int
    description: |
      Input X-BAR channel this eCAP claims for its capture route. The
      channel is also written to ECCTL0.INPUTSEL, whose source table maps
      INPUTXBAR1-16 at indices 0-15, so only channels 0-15 are usable
      here. The SoC devicetree assigns a collision-free default per
      instance; boards only override on a conflict.

  "#pwm-cells":
    const: 3

pwm-cells:
  - channel
  - period
  - flags
